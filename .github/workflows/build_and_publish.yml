name: Build and Publish

on:
  push:
    tags:
      - 'alpha/v**'
      - 'beta/v**'
      - 'release/v**'
      - 'test/v**'

env:
  CURSEFORGE_MOD_ID: ${{ vars.CURSEFORGE_MOD_ID }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_KEY }}
  MODRINTH_MOD_ID: ${{ vars.MODRINTH_MOD_ID }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
  MAVEN_USER: ${{ secrets.MAVEN_USER }}
  MAVEN_PASS: ${{ secrets.MAVEN_PASS }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Get release type from github tag
        id: get_release_type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          result-encoding: string
          script: |
            return '${{ github.ref }}'.match(/refs\/tags\/(.*)\/v((.*)-(.*))/)[1];

      - name: Get file version from tag
        id: get_version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          result-encoding: string
          script: |
            return '${{ github.ref }}'.match(/refs\/tags\/(.*)\/v((.*)-(.*))/)[4];

      - name: Get main mc version from tag
        id: get_mc_version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          result-encoding: string
          script: |
            return '${{ github.ref }}'.match(/refs\/tags\/(.*)\/v((.*)-(.*))/)[3];

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build
        run: ./gradlew build
        env:
          MOD_VERSION: ${{ steps.get_version.outputs.result }}

      - name: Update CHANGELOG
        id: changelog
        uses: klikli-dev/changelog-action@main
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          mcVersion: ${{ steps.get_mc_version.outputs.result }}

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          name: magicparticleslib-${{ steps.get_mc_version.outputs.result }}-${{ steps.get_version.outputs.result }}-neoforge-${{ steps.get_release_type.outputs.result }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
          tag: ${{ github.ref }}
          artifacts: ./build/libs/magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}.jar
          artifactContentType: application/java-archive

      - name: Update mod_version in gradle.properties
        if: ${{ steps.get_release_type.outputs.result != 'test' }}
        run: sed -i "s/^mod_version=.*/mod_version=${{ steps.get_version.outputs.result }}/" gradle.properties

      - name: Commit CHANGELOG.md and gradle.properties
        uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ steps.get_release_type.outputs.result != 'test' }}
        with:
          branch: version/${{ steps.get_mc_version.outputs.result }}
          commit_message: 'docs: update CHANGELOG.md and mod_version for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md gradle.properties

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_MOD_ID != '' && env.MODRINTH_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ env.MODRINTH_MOD_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: |
            build/libs/magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}.jar
            build/libs/magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}-sources.jar
          name: magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}.jar
          version: ${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}
          version-type: ${{ steps.get_release_type.outputs.result }}
          loaders: |
            neoforge
          game-versions: |
            ${{ steps.get_mc_version.outputs.result }}
          changelog: |-
            ${{ steps.changelog.outputs.changes }}

            Find changes for all versions at https://github.com/klikli-dev/magic-particles-lib/releases

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_MOD_ID != '' && env.CURSEFORGE_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: ${{ env.CURSEFORGE_MOD_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: |
            build/libs/magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}.jar
            build/libs/magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}-sources.jar
          name: magicparticleslib-${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}.jar
          version: ${{ steps.get_mc_version.outputs.result }}-neoforge-${{ steps.get_version.outputs.result }}
          version-type: ${{ steps.get_release_type.outputs.result }}
          loaders: |
            neoforge
          game-versions: |
            ${{ steps.get_mc_version.outputs.result }}
          changelog: |-
            ${{ steps.changelog.outputs.changes }}

            Find changes for all versions at https://github.com/klikli-dev/magic-particles-lib/releases

      - name: Publish
        if: ${{ steps.get_release_type.outputs.result != 'test' && env.MAVEN_USER != '' && env.MAVEN_PASS != '' }}
        run: ./gradlew publish
        env:
          MAVEN_USER: ${{ env.MAVEN_USER }}
          MAVEN_PASS: ${{ env.MAVEN_PASS }}
          MOD_VERSION: ${{ steps.get_version.outputs.result }}
